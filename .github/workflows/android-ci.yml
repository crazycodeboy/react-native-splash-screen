name: React Native Splash Screen Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-android:
    name: Build Android Library
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Set up Node.js to install dependencies from package.json
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Install npm dependencies
      - name: Install Dependencies
        run: npm install

      # 4. Set up Java (using JDK 17 to satisfy Android SDK requirements)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      # 5. Set up Android SDK (installs necessary build tools)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 6. Build the Android library (release build) using gradlew if available; otherwise, fallback to system gradle
      - name: Build Android Library
        run: |
          cd android
          if [ -f gradlew ]; then
            echo "Using gradlew wrapper"
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            echo "gradlew not found, using system gradle"
            gradle assembleRelease
          fi

      # 7. Upload the generated AAR artifact (for library projects)
      - name: Upload AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-native-splash-screen-release
          path: android/build/outputs/aar/*.aar
