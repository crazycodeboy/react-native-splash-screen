name: React Native Splash Screen Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-android:
    name: Build Android Library with Gradle 7.6
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code.
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Set up Node.js (to install dependencies).
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Install npm dependencies.
      - name: Install Dependencies
        run: npm install

      # 4. Set up Java (JDK 17 required by Android SDK).
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      # 5. Set up Android SDK (installs necessary build tools).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 6. Download Gradle 7.6 and build the Android library.
      - name: Install Gradle 7.6 and Build Android Library
        run: |
          echo "Downloading Gradle 7.6..."
          wget https://services.gradle.org/distributions/gradle-7.6-bin.zip
          unzip gradle-7.6-bin.zip -d gradle
          export PATH=$(pwd)/gradle/gradle-7.6/bin:$PATH
          echo "Using Gradle version:"
          gradle -v
          echo "Building Android library..."
          cd android
          gradle assembleRelease

      # 7. Upload the generated AAR artifact.
      - name: Upload AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-native-splash-screen-release
          path: android/build/outputs/aar/*.aar
